name: Build & Push Docker Image

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm test
      # Type-checking runs as part of `next build` (in the Docker build
      # below), not here: Next 16's typed-route ambient types (e.g.
      # `LayoutProps`) only exist after a build/dev run has generated
      # .next/types, so a standalone `tsc --noEmit` here would fail on a
      # clean checkout even though the code is correct.

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fafnir:latest
          no-cache: true

      # No redeploy-on-server step yet: unlike frigg/family-app there is no
      # Dockhand compose stack for fafnir on Sleipnir yet. Once that stack
      # exists, add an appleboy/ssh-action step here (SSH_HOST/SSH_PRIVATE_KEY
      # secrets) that runs `docker compose pull && docker compose up -d`.
